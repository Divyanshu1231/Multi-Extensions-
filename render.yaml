services:
  # FastAPI backend - Neon PostgreSQL is supplied as DATABASE_URL in Render dashboard
  - type: web
    name: central-extension-platform-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "10"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: ADMIN_USERNAME
        value: superadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://central-extension-platform-admin.onrender.com,http://localhost:5173
      - key: ENVIRONMENT
        value: production

  # React + Vite admin dashboard
  - type: web
    name: central-extension-platform-admin
    runtime: static
    rootDir: admin-panel
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://central-extension-platform-api.onrender.com
